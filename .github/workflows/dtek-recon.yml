# TEMPORARY (plan step 2): reconnaissance of the DTEK krem protocol from an Actions runner.
# No secrets, read-only token, structure-only logs. Delete after the recon is finished.
name: DTEK recon (temporary)

on:
  push:
    branches: [claude/cool-cannon-p7ttgk]
    paths:
      - 'scripts/recon/**'
      - '.github/workflows/dtek-recon.yml'

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe DTEK krem (structure only)
        run: node scripts/recon/dtek-recon.mjs
