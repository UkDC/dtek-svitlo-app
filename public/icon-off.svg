<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D0B12" />
      <stop offset="85%" stop-color="#0E0508" />
      <stop offset="100%" stop-color="#060204" />
    </radialGradient>
    <linearGradient id="redNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background base rounded card -->
  <rect width="192" height="192" rx="46" fill="url(#bgGlow)" />
  <rect width="188" height="188" x="2" y="2" rx="44" fill="none" stroke="#EF4444" stroke-opacity="0.3" stroke-width="2" />

  <!-- Outage Slash & Bolt with Glow -->
  <g filter="url(#glowRed)">
    <!-- Broken / Off Bolt -->
    <path d="M108 30L52 106h36l-8 44 8-12 36-52H96l12-52z" fill="url(#redNeon)" />
    <!-- Prohibitory dynamic slash -->
    <line x1="42" y1="150" x2="150" y2="42" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="42" y1="150" x2="150" y2="42" stroke="#EF4444" stroke-width="14" stroke-linecap="round" stroke-opacity="0.8" />
  </g>
</svg>
