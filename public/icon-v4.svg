<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="v4-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEF2"/>
    </linearGradient>
    <linearGradient id="v4-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.5" stop-color="#FFB703"/>
      <stop offset="1" stop-color="#FB8500"/>
    </linearGradient>
    <linearGradient id="v4-graphite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5060"/>
      <stop offset="1" stop-color="#20242C"/>
    </linearGradient>
    <filter id="v4-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8A5A00" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- v4: white tile, one day ring (amber = light, graphite = outage), bolt. Full-bleed: iOS applies its own mask. -->
  <rect width="512" height="512" fill="url(#v4-bg)"/>
  <circle cx="256" cy="256" r="148.5" fill="none" stroke="#E9E5DC" stroke-width="51.2"/>
  <g filter="url(#v4-shadow)">
    <circle cx="256" cy="256" r="148.5" fill="none" stroke="url(#v4-amber)" stroke-width="51.2" stroke-linecap="round" stroke-dasharray="513.2 933.1" transform="rotate(-112 256 256)"/>
    <circle cx="256" cy="256" r="148.5" fill="none" stroke="url(#v4-graphite)" stroke-width="51.2" stroke-linecap="round" stroke-dasharray="177.3 933.1" transform="rotate(112 256 256)"/>
  </g>
  <path transform="translate(256 256) scale(3.8912) translate(-50 -50)" d="M54.5 29 L38.5 52.5 Q37.6 54 39.4 54 L48.5 54 L45.5 71 L61.5 47.5 Q62.4 46 60.6 46 L51.5 46 Z" fill="#1B1D22" stroke="#1B1D22" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
