<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="l1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EDE6D6"/>
    </linearGradient>
    <linearGradient id="l1-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="55%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E58E00"/>
    </linearGradient>
    <filter id="l1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B37800" flood-opacity="0.20"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#l1-bg)"/>
  <!-- Calm sand track -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#DDD5C4" stroke-width="40"/>
  <!-- Off-period graphite arc (bottom-left) -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#2B303A" stroke-width="40" stroke-linecap="round"
          stroke-dasharray="220 904.78" stroke-dashoffset="-495" transform="rotate(-90 256 256)"/>
  <!-- Glowing amber ON arcs (clearly separated) -->
  <g filter="url(#l1-glow)" transform="rotate(-90 256 256)" fill="none" stroke="url(#l1-amber)" stroke-width="40" stroke-linecap="round">
    <circle cx="256" cy="256" r="144" stroke-dasharray="305 904.78" stroke-dashoffset="-35"/>
    <circle cx="256" cy="256" r="144" stroke-dasharray="105 904.78" stroke-dashoffset="-775"/>
  </g>
  <!-- App-style "Now" marker: white fill + dark #1B1D22 stroke -->
  <circle cx="364" cy="350" r="16" fill="#FFFFFF" stroke="#1B1D22" stroke-width="7"/>
  <!-- Crisp dark graphite bolt in center -->
  <path d="M273 178 L214 263 Q211 267 216 267 L251 267 L240 334 L299 249 Q302 245 297 245 L262 245 Z"
        fill="#1B1D22" stroke="#1B1D22" stroke-width="7" stroke-linejoin="round"/>
</svg>
